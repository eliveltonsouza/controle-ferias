const paths={home:'M3 10 12 3l9 7M5 9v12h14V9M9 21v-7h6v7',calendar:'M5 5h14a2 2 0 0 1 2 2v13H3V7a2 2 0 0 1 2-2ZM7 3v4M17 3v4M3 11h18M7 15h2M13 15h2',people:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 4a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.87M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',periods:'M4 3h16v18H4ZM8 7h8M8 12h8M8 17h5',alert:'m12 3 10 18H2L12 3ZM12 9v5M12 17h.01',download:'M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5',plus:'M12 5v14M5 12h14',check:'m5 12 4 4L19 6',arrow:'M5 12h14m-5-5 5 5-5 5',left:'m15 5-7 7 7 7',right:'m9 5 7 7-7 7',close:'m6 6 12 12M6 18 18 6',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2',leaf:'M20 3C8 3 3 7 4 14c1 8 13 9 16-11ZM5 19l9-9',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM12 7v5l3 2',shield:'m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Zm-4 9 3 3 5-6'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.periods}"/></svg>`;
const button=(a,label,cls='',attrs='')=>`<button type="button" data-action="${a}" class="${cls}" ${attrs}>${label}</button>`;
const badge=(s,t='slate')=>`<span class="badge ${t}">${esc(s)}</span>`;
const seed=C.validateDb(JSON.parse($('#seed').textContent)),key='ferias-novo-v2-'+seed.datasetId;
let db=structuredClone(seed),persistent=true,backupAt=null,restoreData=null;
try{const stored=localStorage.getItem(key);if(stored){const x=C.validateDb(JSON.parse(stored));if(x.savedAt>db.savedAt)db=x;}backupAt=localStorage.getItem(key+'-backup');}catch(e){persistent=false;}
C.ensurePeriods(db);try{localStorage.setItem(key,JSON.stringify(db));}catch(e){persistent=false;}
const ui={page:'overview',search:'',view:'current',month:C.today().slice(0,7)+'-01',employee:'all'};
let timer,searchTimer;
const staff=()=>db.employees.slice().sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
const person=id=>C.person(db,id);
const sorted=ps=>ps.slice().sort((a,b)=>person(a.employeeId).name.localeCompare(person(b.employeeId).name,'pt-BR')||a.index-b.index);
const match=p=>!ui.search||norm(person(p.employeeId).name).includes(norm(ui.search));
const current=()=>sorted(C.currentPeriods(db));
const personHtml=id=>{const e=person(id);return `<div class="row"><span class="avatar">${esc(initials(e.name))}</span><div><div class="person-name">${esc(display(e.name))}</div><div class="person-meta">Admissão ${fmt(e.admission)}</div></div></div>`;};
const range=(a,b)=>`<span class="gozo-range">${fmt(a)}<br><span class="muted">a ${fmt(b)}</span></span>`;
const title=(name,sub,action='')=>`<div class="heading"><div><div class="eyebrow">Gestão de pessoas</div><h1>${name}</h1><p class="sub">${sub}</p></div><div class="heading-actions">${action}</div></div>`;
const empty=(name,sub='')=>`<div class="empty">${icon('calendar')}<strong>${name}</strong>${sub}</div>`;
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('#toast').style.display='none',4500);}
function save(msg='Alterações salvas neste navegador.'){
 db.savedAt=Date.now();try{localStorage.setItem(key,JSON.stringify(db));persistent=true;}catch(e){persistent=false;}
 render();toast(persistent?msg:'Alterações em memória. Use Salvar cópia antes de fechar.');
}
function render(){
 const pages={overview:['Visão geral','home'],control:['Férias atuais','periods'],future:['Próximos períodos','clock'],calendar:['Calendário','calendar'],employees:['Funcionários','people'],backup:['Backup e ajustes','settings']};
 const pending=db.periods.filter(p=>!p.openingConfirmed).length;
 $('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">${icon('leaf')}</span><div>Férias da equipe<small>NOVO CONTROLE</small></div></div><div class="nav-label">ORGANIZAÇÃO</div><nav class="nav" aria-label="Navegação principal">${Object.entries(pages).map(([p,[n,i]])=>button('nav',icon(i)+n+(p==='control'&&pending?`<span class="nav-count">${pending}</span>`:''),'nav-btn '+(ui.page===p?'active':''),`data-page="${p}" ${ui.page===p?'aria-current="page"':''}`)).join('')}</nav><div class="sidebar-foot"><div class="local-indicator"><span class="dot"></span>Somente neste computador</div><p>Histórico anterior regularizado.<br>Início do controle: ${fmt(db.baselineDate)}.</p><p>Use “Salvar cópia” para guardar seus lançamentos.</p></div></aside><main class="main">${persistent?'':'<div class="save-error">Salvamento automático indisponível. Use Salvar cópia antes de fechar.</div>'}<div class="topbar"><div class="breadcrumb">Minha empresa &nbsp; / &nbsp; <b>${pages[ui.page][0]}</b></div><div class="top-actions"><span class="storage-note">${persistent?'Salvo neste navegador':'Alterações em memória'}</span>${button('snapshot',icon('download')+'Salvar cópia','small')}</div></div>${({overview,control:controlPage,future:futurePage,calendar:calendarPage,employees:employeesPage,backup:backupPage}[ui.page])()}</main></div>`;
}
function metric(label,value,foot,ic){return `<article class="metric"><div class="metric-top"><span>${label}</span><span class="metric-icon">${icon(ic)}</span></div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></article>`;}
function overview(){
 const at=C.today(),ps=current(),inGozo=ps.filter(p=>{const m=C.metrics(db,p);return m.acquired<=at&&m.deadline>=at;}),acquiring=ps.filter(p=>C.metrics(db,p).acquired>at),pending=ps.filter(p=>!p.openingConfirmed);
 return title('Controle de férias','Períodos atuais e futuros, em ordem alfabética.',button('event',icon('plus')+'Lançar férias','primary'))+
 `<div class="filters" style="margin-bottom:20px"><span class="note">Hoje, ${fmt(at)} · Brasília</span><span class="badge green">Histórico anterior regularizado</span></div>`+
 `<div class="metrics">${metric('Funcionários',db.employees.length,'Nome e admissão conferidos no PDF','people')}${metric('No período de gozo',inGozo.length,'Direito adquirido, prazo em andamento','leaf')}${metric('Em aquisição',acquiring.length,'Primeiro período ainda em formação','clock')}${metric('Férias atuais a informar',pending.length,'Marque quem já tirou e quem ainda não','periods')}</div>`+
 (pending.length?`<div class="notice pending-banner">${icon('alert')}<div class="grow"><strong>Comece informando as férias do período atual</strong><p>Para quem ainda não saiu, marque “Ainda não tirou”. Para quem já saiu, lance as datas. Os períodos anteriores foram regularizados conforme sua orientação.</p></div>${button('nav','Preencher agora','small','data-page="control"')}</div>`:'')+
 `<section class="card"><div class="card-head"><div><h2>Férias atuais da equipe</h2><p class="sub">O período de cada pessoa acompanha o aniversário da admissão.</p></div>${button('nav','Ver controle '+icon('arrow'),'quiet small','data-page="control"')}</div>${periodTable(ps)}<div class="table-note">Base inicial de 30 dias por período, ajustável. “A informar” significa que ainda falta lançar a situação atual; não significa férias vencidas.</div></section>`;
}
function periodTable(ps){return `<div class="table-wrap"><table><thead><tr><th>Funcionário</th><th>Período aquisitivo</th><th>Período de gozo</th><th>Saldo a programar</th><th>Situação</th><th></th></tr></thead><tbody>${ps.map(p=>{const m=C.metrics(db,p);return `<tr><td>${personHtml(p.employeeId)}</td><td>${range(m.start,m.end)}</td><td>${range(m.acquired,m.deadline)}</td><td>${m.available===null?'<span class="muted">A informar</span>':`<b class="${m.available<0?'danger-text':''}">${m.available} dias</b><div class="person-meta">${m.acquired>C.today()?'Previsão após aquisição':m.recorded+' dias lançados'}</div>`}</td><td>${badge(m.status,m.tone)}</td><td>${button('period',m.pending?'Informar':'Abrir','small',`data-id="${p.id}"`)}</td></tr>`;}).join('')||'<tr><td colspan="6">'+empty('Nenhum período neste filtro','Altere a busca ou a visualização.')+'</td></tr>'}</tbody></table></div>`;}
function controlPage(){
 let ps=ui.view==='all'?sorted(db.periods):current();if(ui.view==='pending')ps=ps.filter(p=>!p.openingConfirmed);ps=ps.filter(match);
 return title('Férias atuais','Lance as datas já utilizadas ou programe as próximas parcelas.',button('event',icon('plus')+'Lançar férias','primary'))+
 `<div class="subnav">${[['current','Períodos atuais'],['pending','A informar'],['all','Todos deste controle']].map(([v,n])=>button('view',n,ui.view===v?'active':'',`data-view="${v}"`)).join('')}</div><section class="card"><div class="table-toolbar"><span class="note">${ps.length} período(s) · ordem alfabética</span><input type="search" id="search" aria-label="Buscar funcionário" placeholder="Buscar funcionário" value="${esc(ui.search)}"></div>${periodTable(ps)}<div class="table-note">Os períodos anteriores ao ponto de partida de cada pessoa são somente consulta. Nenhuma data antiga precisa ser preenchida.</div></section>`;
}
function futurePage(){const ps=sorted(db.periods.filter(p=>C.metrics(db,p).acquired>C.today())).filter(match);return title('Próximos períodos','Os próximos ciclos são criados automaticamente conforme o tempo passa.',button('event',icon('plus')+'Programar férias','primary'))+`<div class="notice pending-banner">${icon('clock')}<div><strong>Planeje a partir do período de gozo</strong><p>As datas aquisitivas são calculadas pela admissão. Os dias indicados para períodos em aquisição são uma previsão do direito integral.</p></div></div><section class="card"><div class="table-toolbar"><span class="note">${ps.length} períodos futuros</span><input type="search" id="search" aria-label="Buscar funcionário" placeholder="Buscar funcionário" value="${esc(ui.search)}"></div>${periodTable(ps)}</section>`;}
const monthName=s=>C.parse(s).toLocaleDateString('pt-BR',{month:'long',year:'numeric',timeZone:'UTC'});
const monthDays=()=>{const start=C.addDays(ui.month,-C.parse(ui.month).getUTCDay());return Array.from({length:42},(_,i)=>C.addDays(start,i));};
const eventEmployee=e=>db.periods.find(p=>p.id===e.periodId)?.employeeId;
const states={planejada:'Planejada',confirmada:'Confirmada',realizada:'Realizada',cancelada:'Cancelada'};
function calendarPage(){const es=db.events.filter(e=>C.live(e)&&(ui.employee==='all'||eventEmployee(e)===ui.employee));return title('Calendário de férias','Veja as datas que você registrou neste novo controle.',button('event',icon('plus')+'Lançar férias','primary'))+`<section class="card"><div class="table-toolbar"><div class="filters">${button('month',icon('left'),'small','data-delta="-1" aria-label="Mês anterior"')}<h2 style="text-transform:capitalize;margin:0;min-width:155px;text-align:center">${monthName(ui.month)}</h2>${button('month',icon('right'),'small','data-delta="1" aria-label="Próximo mês"')}${button('today','Hoje','small')}<input id="month-picker" type="month" aria-label="Ir para mês" value="${ui.month.slice(0,7)}"></div><select id="calendar-person" aria-label="Filtrar funcionário"><option value="all">Toda a equipe</option>${staff().map(e=>`<option value="${e.id}" ${ui.employee===e.id?'selected':''}>${esc(display(e.name))}</option>`).join('')}</select></div><div class="calendar-grid">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<div class="cal-weekday">${d}</div>`).join('')}${monthDays().map(d=>{const ev=es.filter(e=>e.start<=d&&e.end>=d);return `<div class="cal-day ${d.slice(0,7)!==ui.month.slice(0,7)?'out':''} ${d===C.today()?'is-today':''}"><div class="cal-day-num"><span class="day-number">${Number(d.slice(8))}</span>${button('day','+','quiet small',`data-date="${d}" aria-label="Ver ${fmt(d)}"`)}</div>${ev.slice(0,3).map(e=>button('event',esc(display(person(eventEmployee(e)).name.split(' ').slice(0,2).join(' '))),'cal-event '+e.state,`data-id="${e.id}" title="${esc(person(eventEmployee(e)).name)} · ${fmt(e.start)} a ${fmt(e.end)}"`)).join('')}${ev.length>3?button('day','+'+(ev.length-3)+' registros','quiet small',`data-date="${d}"`):''}</div>`;}).join('')}</div><div class="table-note">O calendário começa vazio porque o PDF informa apenas as admissões. Cada parcela aparecerá após o lançamento.</div></section>`;}
function historical(e){return e.baselineIndex>0?`Períodos aquisitivos iniciados antes de ${fmt(C.dates(e,e.baselineIndex).start)}: regularizados.`:'Primeiro período aquisitivo. Não há férias anteriores a lançar.';}
function employeesPage(){const es=staff().filter(e=>!ui.search||norm(e.name).includes(norm(ui.search)));return title('Funcionários','Somente nome e data de admissão, em ordem alfabética.',button('employee',icon('plus')+'Novo funcionário','primary'))+`<section class="card"><div class="table-toolbar"><span class="note">${es.length} funcionários</span><input id="search" type="search" aria-label="Buscar funcionário" placeholder="Buscar funcionário" value="${esc(ui.search)}"></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Admissão</th><th>Ponto de partida do novo controle</th><th></th></tr></thead><tbody>${es.map(e=>`<tr><td>${personHtml(e.id)}</td><td>${fmt(e.admission)}</td><td><b>${fmt(C.dates(e,e.baselineIndex).start)}</b><div class="person-meta">${historical(e)}</div></td><td>${button('employee-detail','Ver períodos','small',`data-id="${e.id}"`)}</td></tr>`).join('')}</tbody></table></div><div class="table-note">O histórico regularizado fica protegido. Novos funcionários podem ser cadastrados acima.</div></section>`;}
function backupPage(){return title('Backup e ajustes','Salve uma cópia completa para continuar em outro dia ou computador.')+`<div class="split"><section class="card"><div class="card-head"><h2>Seus lançamentos ficam aqui</h2>${icon('shield')}</div><div class="card-body"><p class="sub">O navegador salva as alterações automaticamente. Uma cópia exportada guarda o aplicativo e os dados juntos, sem depender de internet.</p><div class="backup-actions">${button('snapshot',icon('download')+'Salvar cópia completa','primary')}${button('backup','Exportar backup JSON')}${button('restore','Restaurar backup')}${button('csv','Exportar tabela CSV')}</div><p class="backup-tip">Guarde as cópias em uma pasta da sua escolha. O arquivo original não é regravado automaticamente e os dados não são sincronizados com outros navegadores.</p><div class="stat-line"><span>Funcionários</span><b>${db.employees.length}</b></div><div class="stat-line"><span>Parcelas registradas</span><b>${db.events.filter(C.live).length}</b></div><div class="stat-line"><span>Última cópia exportada</span><span>${backupAt?new Date(Number(backupAt)).toLocaleString('pt-BR'):'Ainda não exportada'}</span></div></div></section><section class="card"><div class="card-head"><h2>Alertas e ponto de partida</h2>${icon('clock')}</div><div class="card-body"><form id="settings-form"><div class="field"><label for="alert-days">Antecedência para alertar sobre o limite de gozo</label><input id="alert-days" name="alertDays" type="number" min="1" max="365" value="${db.settings.alertDays}" required><small>Em dias corridos. Os alertas de saldo só aparecem após informar as férias atuais.</small></div><button type="submit" class="primary" style="margin-top:16px">Salvar ajuste</button></form><div class="history-tag" style="margin-top:23px">${icon('check')}<div><b>Histórico regularizado em ${fmt(db.baselineDate)}</b><br>Todos os períodos anteriores ao atual de cada pessoa foram considerados cumpridos, conforme informado. Essa regularização não se repete automaticamente nos próximos anos.</div></div><p class="note">Períodos pendentes deste novo controle continuam visíveis mesmo depois do prazo. Nenhum lançamento será apagado com a passagem do ano.</p></div></section></div><section class="card section-space"><div class="card-head"><h2>Como preencher</h2></div><div class="card-body split"><div><div class="help-step"><span class="step-number">1</span><div><b>Abra “Férias atuais”</b><p>Escolha uma pessoa. Marque “Ainda não tirou” ou registre cada intervalo que já foi utilizado no período de gozo mostrado.</p></div></div><div class="help-step"><span class="step-number">2</span><div><b>Confira o saldo</b><p>Depois de lançar todas as parcelas anteriores, confirme que o histórico atual está completo. O saldo passa a descontar as parcelas e o abono.</p></div></div><div class="help-step"><span class="step-number">3</span><div><b>Programe e guarde uma cópia</b><p>Registre as datas futuras e use “Salvar cópia” com frequência. Abra a cópia mais recente para continuar.</p></div></div></div><div class="help-links"><h3>Base de cálculo</h3><p class="note">Cada ciclo aquisitivo tem 12 meses a partir do aniversário de admissão. O gozo corresponde aos 12 meses seguintes, terminando na véspera do próximo aniversário. Os próximos ciclos são criados ao abrir o aplicativo.</p><p class="note">Direito padrão: 30 dias, ajustável em cada período. Faltas, afastamentos ou alteração do ciclo exigem conferência específica. O saldo representa dias ainda não programados, incluindo a reserva de parcelas futuras.</p><p class="note">São exibidos prazos para aviso e pagamento. Confira também feriados, repouso semanal e regras coletivas; essas condições não são validadas neste controle.</p><a href="https://www2.camara.leg.br/legin/fed/declei/1940-1949/decreto-lei-5452-1-maio-1943-415500-normaatualizada-pe.html" target="_blank" rel="noopener noreferrer">Consultar a CLT: arts. 130, 134, 135, 143 e 145</a><p class="note">Fonte dos cadastros: ${esc(db.source.file)}. Apenas nome e admissão foram importados.</p></div></div></section>`;}
function openDialog(name,body,foot=''){$('#modal').innerHTML=`<div class="dialog-head"><h2 id="modal-title">${name}</h2>${button('close',icon('close'),'quiet','aria-label="Fechar"')}</div>${body}${foot}`;if(!$('#modal').open)$('#modal').showModal();}
function close(){if($('#modal').open)$('#modal').close();$('#modal').innerHTML='';}
const field=(name,label,type,val,attrs='',help='')=>`<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(val)}" ${attrs}>${help?`<small>${help}</small>`:''}</div>`;
const footer=(id,label='Salvar')=>`<div class="dialog-foot">${button('close','Voltar')}<button class="primary" form="${id}" type="submit">${label}</button></div>`;
function periodDialog(id){
 const p=db.periods.find(x=>x.id===id),e=person(p.employeeId),m=C.metrics(db,p);
 openDialog('Férias de '+display(e.name),`<div class="dialog-body"><div class="readonly-grid"><div class="readonly-item">Período aquisitivo<b>${fmt(m.start)} a ${fmt(m.end)}</b></div><div class="readonly-item">Período de gozo<b>${fmt(m.acquired)} a ${fmt(m.deadline)}</b></div></div><div class="history-tag">${icon('check')}<div>${historical(e)}<br><span class="subtle">Admissão: ${fmt(e.admission)}. As datas acima são calculadas automaticamente.</span></div></div>${!p.openingConfirmed?`<div class="notice" style="margin:18px 0"><div><strong>Qual é a situação deste período?</strong><p>Registre o que já foi utilizado ou confirme que as férias ainda não começaram.</p><div class="opening-actions">${button('none','Ainda não tirou','small outline-button',`data-id="${p.id}" ${m.events.length?'disabled':''}`)}${button('event','Já tirou: lançar datas','small',`data-period="${p.id}" data-past="true"`)}</div></div></div>`:''}<div class="row between" style="margin-top:23px"><h3>Parcelas deste período</h3>${button('event',icon('plus')+'Lançar parcela','small',`data-period="${p.id}"`)}</div><div class="period-events">${m.events.map(x=>`<div class="detail-event row between"><div><b>${fmt(x.start)} a ${fmt(x.end)}</b><div class="person-meta">${C.days(x.start,x.end)} dias · ${states[x.state]}</div></div>${button('event','Editar','small',`data-id="${x.id}"`)}</div>`).join('')||'<p class="note">Nenhuma parcela registrada.</p>'}</div><form id="period-form" data-id="${p.id}"><div class="form-grid">${field('entitlement','Dias de direito','number',p.entitlement,'required min="0" max="30" step="1"','Total do direito antes de descontar férias e abono.')}${field('abono','Dias convertidos em abono','number',p.abono,'required min="0" max="30" step="1"','Preencha somente quando confirmado.')}<div class="field full"><label for="f-notes">Observações do período</label><textarea name="notes" id="f-notes" maxlength="4000">${esc(p.notes)}</textarea></div><div class="field full"><div class="check-field"><input id="f-confirmed" type="checkbox" name="openingConfirmed" ${p.openingConfirmed?'checked':''}><label for="f-confirmed">Todas as parcelas já tiradas neste período estão lançadas. Se não há parcelas, confirmo que ainda não tirou.</label></div></div></div><div class="form-derived"><div>Dias lançados<strong>${m.recorded}</strong></div><div>Saldo a programar<strong>${m.available===null?'A informar':m.available+' dias'}</strong></div><div>Limite de gozo<strong>${fmt(m.deadline)}</strong></div></div><div id="form-error" class="form-error" role="alert"></div><p class="note">Salve os ajustes antes de abrir outra parcela.</p></form></div>`,footer('period-form','Salvar período'));
}
function employeePeriods(id){const e=person(id);openDialog(display(e.name),`<div class="dialog-body"><p class="form-explanation">Admissão em ${fmt(e.admission)}</p><div class="history-tag">${icon('check')}<div>${historical(e)}<br>Períodos antigos somente para consulta.</div></div>${db.periods.filter(p=>p.employeeId===id).sort((a,b)=>a.index-b.index).map(p=>{const m=C.metrics(db,p);return `<div class="detail-event row between"><div><b>Gozo: ${fmt(m.acquired)} a ${fmt(m.deadline)}</b><div class="person-meta">Aquisição: ${fmt(m.start)} a ${fmt(m.end)}</div>${badge(m.status,m.tone)}</div>${button('period','Abrir','small',`data-id="${p.id}"`)}</div>`;}).join('')}</div>`);}
function employeeDialog(){openDialog('Novo funcionário',`<form id="employee-form" class="dialog-body"><div class="form-grid">${field('name','Nome completo','text','','required maxlength="150"')}${field('admission','Data de admissão','date','','required')}</div><p class="note">Este cadastro inicia no período atual. Períodos anteriores serão considerados regularizados; não use esta opção para cadastrar alguém com férias antigas pendentes.</p><div id="form-error" class="form-error" role="alert"></div></form>`,footer('employee-form','Cadastrar')) ;}
function periodOptions(employee,selected){const ps=db.periods.filter(p=>p.employeeId===employee).sort((a,b)=>a.index-b.index);return '<option value="">Selecione o período</option>'+ps.map(p=>{const m=C.metrics(db,p);return `<option value="${p.id}" ${selected===p.id?'selected':''}>Gozo ${fmt(m.acquired)} a ${fmt(m.deadline)}</option>`;}).join('');}
function eventDialog(id,periodId,date,past=false){
 const old=db.events.find(e=>e.id===id),p=db.periods.find(p=>p.id===(old?.periodId||periodId)),e=old||{id:uid('v'),periodId:p?.id||'',start:date||'',end:'',state:past?'realizada':'planejada',notice:'',payment:'',notes:''};
 openDialog(old?'Editar parcela de férias':'Lançar férias',`<form id="event-form" data-id="${e.id}" class="dialog-body"><div class="form-grid"><div class="field"><label for="f-employee">Funcionário</label><select id="f-employee" name="employee" required><option value="">Selecione</option>${staff().map(x=>`<option value="${x.id}" ${p?.employeeId===x.id?'selected':''}>${esc(display(x.name))}</option>`).join('')}</select></div><div class="field"><label for="f-periodId">Período de gozo</label><select name="periodId" id="f-periodId" required>${periodOptions(p?.employeeId,e.periodId)}</select><small>Confira a qual período pertence esta parcela.</small></div>${field('start','Primeiro dia de férias','date',e.start,'required')}${field('end','Último dia de férias','date',e.end,'required')}${field('duration','Dias corridos (atalho)','number',e.start&&e.end?C.days(e.start,e.end):'','min="1" max="366"','Informe o início e os dias para calcular o fim.')}<div class="field"><label for="f-state">Situação da parcela</label><select id="f-state" name="state">${Object.entries(states).map(([v,n])=>`<option value="${v}" ${v===e.state?'selected':''}>${n}</option>`).join('')}</select></div>${field('notice','Data do aviso entregue (opcional)','date',e.notice)}${field('payment','Data do pagamento (opcional)','date',e.payment)}<div class="field full"><label for="f-notes">Observações da parcela</label><textarea name="notes" id="f-notes" maxlength="4000">${esc(e.notes)}</textarea></div><div class="field full"><div class="check-field"><input id="f-opening" type="checkbox" name="openingConfirmed" ${p?.openingConfirmed?'checked':''}><label for="f-opening">Com esta parcela, todas as férias já tiradas neste período ficam registradas. Pode calcular o saldo restante.</label></div></div></div><div id="event-derived" class="form-derived"></div><div id="event-warnings" class="form-warnings" hidden></div><div class="check-field" id="ack-wrap" style="display:none;margin-top:14px"><input id="f-ack" name="ack" type="checkbox"><label for="f-ack">Conferi os alertas e desejo guardar este registro para acompanhamento.</label></div><div class="form-error" id="form-error" role="alert"></div><p class="note">Dias contados incluindo início e fim. Combine o fracionamento com o funcionário e confira feriados e repouso semanal.</p></form>`,footer('event-form',old?'Salvar parcela':'Salvar férias'));updateEventPreview();
}
function readEvent(){const form=$('#event-form');if(!form)return null;const f=new FormData(form);return{id:form.dataset.id,periodId:f.get('periodId'),start:f.get('start'),end:f.get('end'),state:f.get('state'),notice:f.get('notice')||'',payment:f.get('payment')||'',notes:f.get('notes')||''};}
function updateEventPreview(){const e=readEvent();if(!e)return;const ok=C.validDate(e.start),valid=ok&&C.validDate(e.end);$('#event-derived').innerHTML=`<div>Dias corridos<strong>${valid?C.days(e.start,e.end):'—'}</strong></div><div>Aviso até<strong>${ok?fmt(C.addDays(e.start,-30)):'—'}</strong></div><div>Pagamento até<strong>${ok?fmt(C.addDays(e.start,-2)):'—'}</strong></div>`;const p=db.periods.find(p=>p.id===e.periodId),ws=p&&valid&&C.live(e)?C.warnings(db,p,e):[];$('#event-warnings').hidden=!ws.length;$('#event-warnings').innerHTML=ws.length?'<b>Confira os alertas</b><ul>'+ws.map(w=>'<li>'+esc(w)+'</li>').join('')+'</ul>':'';$('#ack-wrap').style.display=ws.length?'flex':'none';$('#f-ack').required=!!ws.length;}
function dayDialog(d){const es=db.events.filter(e=>C.live(e)&&e.start<=d&&e.end>=d);openDialog('Férias em '+fmt(d),`<div class="dialog-body">${es.map(e=>`<div class="detail-event row between"><div>${personHtml(eventEmployee(e))}<div class="person-meta">${fmt(e.start)} a ${fmt(e.end)}</div></div>${button('event','Editar','small',`data-id="${e.id}"`)}</div>`).join('')||empty('Nenhuma parcela neste dia')}${button('event',icon('plus')+'Programar nesta data','primary',`data-date="${d}" style="margin-top:18px"`)}</div>`);}
function download(content,name,type,backup=true){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);if(backup){backupAt=Date.now();try{localStorage.setItem(key+'-backup',String(backupAt));}catch(e){}}toast('Arquivo gerado. Confira a pasta de downloads.');}
function snapshot(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#seed').textContent=JSON.stringify({...db,savedAt:Date.now()}).replace(/</g,'\\u003c');clone.querySelector('#app').innerHTML='';clone.querySelector('#modal').innerHTML='';clone.querySelector('#modal').removeAttribute('open');clone.querySelector('#toast').style.display='none';download('<!doctype html>\n'+clone.outerHTML,'ferias-novo-'+C.today()+'.html','text/html;charset=utf-8');}
function csv(){const rows=[['Funcionario','Admissao','Inicio aquisitivo','Fim aquisitivo','Inicio do gozo','Limite de gozo','Direito dias','Abono dias','Dias registrados','Saldo a programar','Situacao']];for(const p of sorted(db.periods)){const e=person(p.employeeId),m=C.metrics(db,p);rows.push([e.name,e.admission,m.start,m.end,m.acquired,m.deadline,p.entitlement,p.abono,m.recorded,m.available??'',m.status]);}const quote=x=>{let s=String(x);if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};download('\ufeff'+rows.map(r=>r.map(quote).join(';')).join('\r\n'),'ferias-periodos-'+C.today()+'.csv','text/csv;charset=utf-8',false);}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
 if(a==='nav'){ui.page=b.dataset.page;ui.search='';close();render();window.scrollTo(0,0);}
 if(a==='view'){ui.view=b.dataset.view;render();}
 if(a==='close')close();
 if(a==='period')periodDialog(b.dataset.id);
 if(a==='event')eventDialog(b.dataset.id,b.dataset.period,b.dataset.date,b.dataset.past==='true');
 if(a==='employee-detail')employeePeriods(b.dataset.id);
 if(a==='employee')employeeDialog();
 if(a==='none'){const p=db.periods.find(p=>p.id===b.dataset.id);if(!C.eventsFor(db,p).length){p.openingConfirmed=true;save('Confirmado: ainda não tirou férias neste período.');periodDialog(p.id);}}
 if(a==='month'){ui.month=C.addMonths(ui.month,Number(b.dataset.delta));render();}
 if(a==='today'){ui.month=C.today().slice(0,7)+'-01';render();}
 if(a==='day')dayDialog(b.dataset.date);
 if(a==='snapshot')snapshot();
 if(a==='backup')download(JSON.stringify({...db,savedAt:Date.now()},null,2),'backup-ferias-novo-'+C.today()+'.json','application/json');
 if(a==='csv')csv();
 if(a==='restore'){$('#restore-file').value='';$('#restore-file').click();}
 if(a==='restore-confirm'&&restoreData){db=restoreData;restoreData=null;C.ensurePeriods(db);ui.page='overview';ui.search='';close();save('Backup restaurado.');}
});
function eventFieldsChanged(el){if(el.name==='employee'){$('#f-periodId').innerHTML=periodOptions(el.value,'');$('#f-opening').checked=false;}
 if(el.name==='periodId')$('#f-opening').checked=!!db.periods.find(p=>p.id===el.value)?.openingConfirmed;
 if(el.name==='duration'&&C.validDate($('#f-start').value)&&Number(el.value)>0&&Number(el.value)<=366)$('#f-end').value=C.addDays($('#f-start').value,Number(el.value)-1);
 if(['start','end'].includes(el.name)&&C.validDate($('#f-start').value)&&C.validDate($('#f-end').value))$('#f-duration').value=C.days($('#f-start').value,$('#f-end').value);
 if(el.name!=='ack'){$('#f-ack').checked=false;updateEventPreview();}
}
document.addEventListener('change',ev=>{const el=ev.target;if(el.closest('#event-form'))eventFieldsChanged(el);if(el.id==='calendar-person'){ui.employee=el.value;render();}if(el.id==='month-picker'&&el.value){ui.month=el.value+'-01';render();}});
document.addEventListener('input',ev=>{const el=ev.target;if(el.id==='search'){const v=el.value,pos=el.selectionStart;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{ui.search=v;render();$('#search')?.focus();$('#search')?.setSelectionRange(pos,pos);},160);}if(el.closest('#event-form')&&['start','end','duration'].includes(el.name))eventFieldsChanged(el);});
document.addEventListener('submit',ev=>{ev.preventDefault();const form=ev.target,f=new FormData(form),error=s=>{const el=form.querySelector('#form-error');if(el)el.textContent=s;else toast(s);};
 if(form.id==='period-form'){const p=db.periods.find(p=>p.id===form.dataset.id),next={...p,entitlement:Number(f.get('entitlement')),abono:Number(f.get('abono')),notes:f.get('notes').trim(),openingConfirmed:f.has('openingConfirmed')};if(next.abono>Math.floor(next.entitlement/3))return error('O abono não pode ultrapassar um terço do direito.');if(next.openingConfirmed&&C.metrics(db,next).remaining<0)return error('Confira as parcelas: o total excede o direito informado.');Object.assign(p,next);close();save('Período atualizado.');}
 if(form.id==='event-form'){const e=readEvent(),err=C.eventError(db,e);if(err)return error(err);if((e.notice&&!C.validDate(e.notice))||(e.payment&&!C.validDate(e.payment)))return error('Confira as datas de aviso e pagamento.');if(!$('#event-warnings').hidden&&!f.has('ack'))return error('Confira e confirme os alertas.');if(e.state==='realizada'&&e.end>C.today())return error('Uma parcela realizada não pode terminar no futuro. Use Planejada ou Confirmada.');const old=db.events.find(x=>x.id===e.id);if(old){const oldPeriod=old.periodId;db.events=db.events.map(x=>x.id===e.id?e:x);if(oldPeriod!==e.periodId)db.periods.find(p=>p.id===oldPeriod).openingConfirmed=false;}else db.events.push(e);db.periods.find(p=>p.id===e.periodId).openingConfirmed=f.has('openingConfirmed');close();save('Férias salvas. Saldo e calendário atualizados.');}
 if(form.id==='employee-form'){const name=f.get('name').trim(),admission=f.get('admission');if(!name||!C.validDate(admission))return error('Informe nome e admissão válidos.');if(admission>C.today())return error('A admissão não pode ser futura.');if(db.employees.some(e=>norm(e.name)===norm(name)))return error('Já existe uma pessoa com esse nome.');const e={id:uid('e'),name,admission,baselineIndex:Math.max(0,C.completed(admission,C.today())-1)};db.employees.push(e);C.ensurePeriods(db);for(const p of db.periods.filter(p=>p.employeeId===e.id))p.openingConfirmed=C.metrics(db,p).acquired>C.today();close();save('Funcionário cadastrado.');}
 if(form.id==='settings-form'){db.settings.alertDays=Number(f.get('alertDays'));save('Alerta atualizado.');}
});
$('#restore-file').addEventListener('change',async ev=>{const file=ev.target.files[0];if(!file)return;try{if(file.size>15000000)throw Error('Arquivo maior que 15 MB.');restoreData=C.validateDb(JSON.parse(await file.text()));openDialog('Restaurar backup',`<div class="dialog-body"><p>O arquivo contém <b>${restoreData.employees.length} funcionários</b> e <b>${restoreData.events.length} parcelas</b>.</p><p>Os dados atuais deste navegador serão substituídos. Salve uma cópia antes de continuar.</p>${button('backup','Exportar dados atuais')}</div>`,`<div class="dialog-foot">${button('close','Voltar')}${button('restore-confirm','Restaurar e substituir','primary')}</div>`);}catch(e){restoreData=null;toast(e.message);}});
window.addEventListener('storage',ev=>{if(ev.key===key&&ev.newValue){try{const x=C.validateDb(JSON.parse(ev.newValue));if(x.savedAt>db.savedAt){db=x;close();render();toast('Dados atualizados por outra aba. Reabra o formulário para continuar.');}}catch(e){toast('A outra aba gravou um conteúdo incompatível.');}}});
window.addEventListener('beforeunload',ev=>{if(!persistent){ev.preventDefault();ev.returnValue='';}});
setInterval(()=>{if(!$('#modal').open&&!document.activeElement?.matches('input,select,textarea')){const added=C.ensurePeriods(db);if(added)save('Novos períodos disponibilizados.');else if(['overview','calendar'].includes(ui.page))render();}},60000);
render();
})();
</script>

</body></html>
